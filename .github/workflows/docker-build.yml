name: Build & Push Docker Image

on:
  # Rebuild when we push to dev or tag a release
  push:
    branches: [dev]
    tags:
      - 'v*'
  # Check upstream daily at 6 AM UTC (11 PM PDT)
  schedule:
    - cron: '0 6 * * *'
  # Manual trigger
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: keltech-services/pixelfed

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync upstream
        id: sync
        run: |
          git remote add upstream https://github.com/pixelfed/pixelfed.git || true
          git fetch upstream dev --tags
          
          LOCAL_SHA=$(git rev-parse HEAD)
          UPSTREAM_SHA=$(git rev-parse upstream/dev)
          
          if [ "$LOCAL_SHA" = "$UPSTREAM_SHA" ]; then
            echo "Already up to date."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream changes detected, merging..."
            git merge upstream/dev --no-edit
            git push origin dev --tags
            echo "updated=true" >> $GITHUB_OUTPUT
          fi

    outputs:
      updated: ${{ steps.sync.outputs.updated }}

  build:
    runs-on: ubuntu-latest
    needs: [sync-upstream]
    if: |
      always() &&
      (needs.sync-upstream.result == 'skipped' || needs.sync-upstream.outputs.updated == 'true')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
